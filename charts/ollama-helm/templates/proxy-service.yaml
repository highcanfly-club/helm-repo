{{- if .Values.proxy.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ollama.fullname" . }}-proxy
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
    app: {{ include "ollama.name" . }}-proxy
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "ollama.name" . }}-proxy
{{- end -}}
