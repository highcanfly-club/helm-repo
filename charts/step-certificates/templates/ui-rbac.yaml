{{- if .Values.ui.enabled }}
{{- $ui := include "step-certificates.ui.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ui }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "step-certificates.ui.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.ui.certManagerSync.enabled }}
{{- if .Values.ui.certManagerSync.enabled }}
---
# read-only: list the cert-manager Certificates (no access to Secrets)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ui }}-{{ .Release.Namespace }}
  labels:
    {{- include "step-certificates.ui.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $ui }}-{{ .Release.Namespace }}
  labels:
    {{- include "step-certificates.ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $ui }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $ui }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
