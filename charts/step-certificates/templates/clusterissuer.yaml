{{- if .Values.clusterIssuer.enabled }}
{{- $fullname := include "step-certificates.fullname" . }}
{{- $root := .Values.inject.certificates.root_ca }}
{{- if not $root }}{{ fail "clusterIssuer.enabled requires inject.certificates.root_ca (caBundle of the ACME endpoint)" }}{{ end }}
# cert-manager -> this CA (ACME). HTTP-01 challenges are validated by the CA: the name must resolve and
# answer on :80 FROM the CA pod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  labels:
    {{- include "step-certificates.labels" . | nindent 4 }}
spec:
  acme:
    server: https://{{ $fullname }}.{{ .Release.Namespace }}.svc.cluster.local/acme/{{ .Values.clusterIssuer.acmeProvisioner }}/directory
    caBundle: {{ $root | b64enc }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-acme-account-key
    solvers:
      - http01:
          ingress:
            {{- if or .Values.clusterIssuer.ingressClassName .Values.clusterIssuer.solverAffinity }}
            {{- with .Values.clusterIssuer.ingressClassName }}
            ingressClassName: {{ . }}
            {{- end }}
            {{- with .Values.clusterIssuer.solverAffinity }}
            podTemplate:
              spec:
                affinity:
                  {{- toYaml . | nindent 18 }}
            {{- end }}
            {{- else }}
            {}
            {{- end }}
{{- end }}
