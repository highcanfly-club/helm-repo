{{- if .Values.ingress.enabled }}
{{- $fullname := include "wormhole.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels: {{- include "wormhole.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.page.enabled }}
          # /v1 is the mailbox WebSocket; the page (and its /transit bridge) serves the rest
          - path: /v1
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service: {name: {{ $fullname }}-mailbox, port: {number: 4000}}
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service: {name: {{ $fullname }}-page, port: {number: 8080}}
          {{- else }}
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service: {name: {{ $fullname }}-mailbox, port: {number: 4000}}
          {{- end }}
{{- end }}
