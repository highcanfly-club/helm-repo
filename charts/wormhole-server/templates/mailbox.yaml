{{- $fullname := include "wormhole.fullname" . -}}
{{- $ctx := dict "root" . "component" "mailbox" -}}
{{- $m := .Values.mailbox -}}
{{- if and $m.persistence.enabled (not $m.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-mailbox-data
  labels: {{- include "wormhole.labels" $ctx | nindent 4 }}
spec:
  accessModes: {{- toYaml $m.persistence.accessModes | nindent 4 }}
  {{- with $m.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $m.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-mailbox
  labels: {{- include "wormhole.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite on a ReadWriteOnce volume: never two pods at once
  selector:
    matchLabels: {{- include "wormhole.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wormhole.labels" $ctx | nindent 8 }}
        {{- with $m.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $m.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml $m.podSecurityContext | nindent 8 }}
      {{- include "wormhole.scheduling" $m | nindent 6 }}
      containers:
        - name: mailbox
          image: {{ include "wormhole.image" (dict "root" . "image" $m.image) }}
          imagePullPolicy: {{ include "wormhole.pullPolicy" (dict "root" . "image" $m.image) }}
          ports:
            - {name: http, containerPort: 4000}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          {{- with $m.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $m.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml $m.resources | nindent 12 }}
          securityContext: {{- toYaml $m.securityContext | nindent 12 }}
      volumes:
        - name: data
          {{- if $m.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-mailbox-data" $fullname) $m.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mailbox
  labels: {{- include "wormhole.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "wormhole.selectorLabels" $ctx | nindent 4 }}
  ports:
    - {name: http, port: 4000, targetPort: http}
